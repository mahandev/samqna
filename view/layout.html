{{define "base"}}<!doctype html>
<html lang="en" data-theme="corporate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · SamQnA</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%A5%3C/text%3E%3C/svg%3E">
</head>
<body class="min-h-screen bg-base-200">
  <div class="navbar bg-base-100 border-b border-base-300 sticky top-0 z-30">
    <div class="flex-1 max-w-5xl mx-auto w-full px-4">
      <a href="/" class="btn btn-ghost text-xl normal-case gap-2">
        <span class="text-2xl">🎥</span>
        <span class="font-bold">SamQnA</span>
      </a>
      <div class="flex-1"></div>
      <nav class="flex gap-1">
        <a href="/" class="btn btn-ghost btn-sm">Browse</a>
        <a href="/submit" class="btn btn-primary btn-sm">Ask a question</a>
      </nav>
    </div>
  </div>

  <main class="max-w-5xl mx-auto w-full px-4 py-6">{{template "content" .}}</main>

  <footer class="footer footer-center p-6 text-base-content/60 text-sm">
    <p>Open Q&amp;A inbox · powered by AI triage</p>
  </footer>
</body>
</html>{{end}}
